<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare | The AI-Powered Patient Operating System (ABDM & HIPAA)</title>
  <meta name="description" content="PulseCare by Nexora is the intelligent patient operating system for doctor discovery, AI prescription scanning, 5km pharmacy stock discovery, and ABDM EMR vault." />
  <meta name="keywords" content="PulseCare, patient portal, doctor booking, prescription scanner, Gemini 3.1 Flash, pharmacy stock, ABDM, FHIR R4, generic medicines" />

  <!-- Modern Geometric Sans Typography Stack (Roobert PRO / Plus Jakarta Sans / Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Miro Design System CSS Modules from DESIGN.md -->
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/responsive.css" />

  <!-- Leaflet Interactive Maps CSS & JS (Local Vendored Asset) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- Native Browser Import Map for Bare Module Specifiers -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react-router": "https://esm.sh/react-router@6.28.0?deps=react@18.3.1",
      "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- Sticky Top Navigation Mount (PulseCare Header) -->
    <div id="navbar-mount"></div>

    <!-- Main Patient Interface Viewport -->
    <main id="main-content" role="main" class="container">
      <div id="patient-portal-mount"></div>
    </main>

    <!-- Massive 6-Column Dark Footer Mount (Miro Design) -->
    <div id="footer-mount"></div>

    <!-- Global Modals (QR Code, FHIR Inspector, Booking, Emergency SOS) Mount -->
    <div id="modal-mount"></div>

    <!-- Persistent Floating AI Companion (PulseCare AI) Mount -->
    <div id="pulsecare-chat-mount"></div>
  </div>

  <!-- ES Module Application Script -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
